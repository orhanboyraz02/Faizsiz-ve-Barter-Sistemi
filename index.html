<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Faizsiz Finans Ekosistemi| Ortak Yatırım, Barter, FIRE Fonu, Katılım</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0a0f2c 0%, #0b1a3a 100%); min-height: 100vh; }
        .text-gold { color: #f5b042 !important; }
        .bg-gold { background: #f5b042; }
        .btn-gold { background: linear-gradient(135deg, #f5b042 0%, #e09d2c 100%); color: #0a0f2c; font-weight: 600; transition: 0.2s; }
        .btn-gold:hover { transform: scale(1.02); opacity: 0.95; }
        .card { background: rgba(18, 23, 63, 0.95); border-radius: 1.5rem; border: 1px solid #1e2a5e; transition: 0.2s; }
        .card:hover { border-color: #f5b04280; transform: translateY(-4px); }
        .sidebar-link { transition: 0.2s; cursor: pointer; border-radius: 0.75rem; padding: 0.6rem 1rem; display: flex; align-items: center; gap: 12px; }
        .sidebar-link:hover { background: #f5b04220; color: #f5b042; }
        .active-page { background: linear-gradient(135deg, #f5b042 0%, #e09d2c 100%); color: #0a0f2c; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #0f1338; border-radius: 1.5rem; max-width: 500px; width: 90%; padding: 2rem; border: 1px solid #f5b042; }
        .admin-badge { background: #f5b04220; color: #f5b042; border-radius: 999px; padding: 4px 12px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }
        .admin-badge:hover { background: #f5b04240; }
        .product-item, .investment-item, .faizsiz-item { transition: 0.2s; }
        .product-item:hover, .investment-item:hover, .faizsiz-item:hover { background: #f5b04210; }
    </style>
</head>
<body>

<div id="app" class="min-h-screen"></div>

<script>
    // ---------- STATE ----------
    let currentPage = "home";
    let isLoggedIn = false;
    let isAdmin = false;
    let user = { name: "Ahmet Yatırımcı", email: "ahmet@katilim.com", ortaklik: "Gümüş Ortak" };
    
    // ---------- KULLANICININ YATIRIMLARI (İzleme/Yönetme) ----------
    let userInvestments = [
        { id: 1, name: "Kira Sertifikası (Sukuk)", amount: 25000, date: "2025-01-15", status: "Aktif", getiri: "%14 (yıllık)" },
        { id: 2, name: "Katılım Endeksi Sepeti", amount: 15000, date: "2025-02-10", status: "Aktif", getiri: "%12 (yıllık)" }
    ];
    
    // ---------- YATIRIM ÜRÜNLERİ (Yönetici ekleyip silebilir) ----------
    let yatirimUrunleri = [
        { id: 1, name: "Kira Sertifikası (Sukuk)", getiri: "Yıllık %14", risk: "Düşük", minTutar: "5.000 ₺" },
        { id: 2, name: "Katılım Endeksi Hisse Sepeti", getiri: "Yıllık %12", risk: "Orta", minTutar: "10.000 ₺" },
        { id: 3, name: "Altın ve Emtia Katılım Fonu", getiri: "Yıllık %10", risk: "Düşük", minTutar: "15.000 ₺" },
        { id: 4, name: "Gayrimenkul Ortaklığı (REIT)", getiri: "Yıllık %15", risk: "Orta", minTutar: "25.000 ₺" }
    ];
    
    // ---------- DİĞER VERİLER ----------
    let ortaklikPaketleri = [
        { id: 1, name: "Ortak", komisyon: "%3", fiyat: "Ücretsiz", icon: "fa-user" },
        { id: 2, name: "Bronz Ortak", komisyon: "%5", fiyat: "500 ₺", icon: "fa-medal" },
        { id: 3, name: "Gümüş Ortak", komisyon: "%10", fiyat: "2.000 ₺", icon: "fa-gem" },
        { id: 4, name: "Altın Ortak", komisyon: "%15", fiyat: "5.000 ₺", icon: "fa-crown" },
        { id: 5, name: "Platin Ortak", komisyon: "%20", fiyat: "10.000 ₺", icon: "fa-star" },
        { id: 6, name: "Elmas Ortak", komisyon: "%30", fiyat: "20.000 ₺", icon: "fa-diamond" }
    ];
    
    let faizsizUrunler = [
        { id: 1, name: "Araç Finansmanı", aciklama: "Faizsiz araç sahibi olma sistemi", fiyat: "Başlangıç 50.000 ₺" },
        { id: 2, name: "Ev Finansmanı", aciklama: "Eminevim/Katılımevim modeli", fiyat: "Başlangıç 200.000 ₺" },
        { id: 3, name: "İşyeri Finansmanı", aciklama: "Ticari gayrimenkul faizsiz", fiyat: "Başlangıç 300.000 ₺" },
        { id: 4, name: "Ev Eşyası Finansmanı", aciklama: "Beyaz eşya, mobilya, elektronik", fiyat: "Başlangıç 10.000 ₺" }
    ];
    
    let ortakYatirimHavuzlari = [
        { id: 1, name: "Teknolojik Üretim Girişimi", hedef: "10.000.000 ₺", toplanan: "3.200.000 ₺", katilim: "1.000 ₺" },
        { id: 2, name: "Doğal Ürün Girişimi", hedef: "5.000.000 ₺", toplanan: "1.800.000 ₺", katilim: "500 ₺" },
        { id: 3, name: "Yazılım ve Yapay Zeka Girişimi", hedef: "8.000.000 ₺", toplanan: "2.500.000 ₺", katilim: "2.000 ₺" }
    ];
    
    // ---------- YÖNETİM PANELİ (Şifreli) ----------
    let adminPassword = "admin123";
    
    function openAdminPanel() {
        const modal = document.createElement("div");
        modal.className = "modal";
        modal.innerHTML = `
            <div class="modal-content">
                <h2 class="text-2xl font-bold text-gold mb-4">👑 Yönetici Paneli</h2>
                <input type="password" id="adminPass" placeholder="Şifre" class="w-full p-3 rounded-xl bg-[#1a1f4a] border border-[#2a2f5a] mb-4">
                <button id="verifyAdmin" class="w-full btn-gold py-2 rounded-xl">Giriş</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById("verifyAdmin").onclick = () => {
            if (document.getElementById("adminPass").value === adminPassword) {
                isAdmin = true;
                modal.remove();
                render();
                alert("Yönetici paneline hoş geldiniz! Yatırım ürünü ekleyip silebilirsiniz.");
            } else {
                alert("Şifre yanlış!");
            }
        };
    }
    
    // ---------- YATIRIM ÜRÜNÜ EKLEME/SİLME ----------
    function addYatirimUrunu() {
        let name = prompt("Yatırım Ürünü Adı (örn: Yeşil Enerji Fonu)");
        if (!name) return;
        let getiri = prompt("Getiri Oranı (örn: Yıllık %16)");
        let risk = prompt("Risk Seviyesi (Düşük/Orta/Yüksek)");
        let minTutar = prompt("Minimum Tutar (örn: 8.000 ₺)");
        yatirimUrunleri.push({ id: Date.now(), name, getiri, risk, minTutar });
        render();
        alert("✅ Yatırım ürünü eklendi!");
    }
    
    function deleteYatirimUrunu(id) {
        if (confirm("Bu yatırım ürününü silmek istediğinize emin misiniz?")) {
            yatirimUrunleri = yatirimUrunleri.filter(u => u.id !== id);
            render();
        }
    }
    
    // ---------- KULLANICI YATIRIM İZLEME/YÖNETME ----------
    function addUserInvestment() {
        let productNames = yatirimUrunleri.map(u => u.name).join(", ");
        let name = prompt(`Hangi ürüne yatırım yapmak istiyorsunuz? Mevcut ürünler: ${productNames}`);
        if (!name) return;
        let amount = prompt("Yatırım tutarı (₺)");
        if (!amount) return;
        let found = yatirimUrunleri.find(u => u.name.toLowerCase() === name.toLowerCase());
        if (!found) {
            alert("Ürün bulunamadı! Lütfen listedeki ürünlerden birini seçin.");
            return;
        }
        userInvestments.push({ id: Date.now(), name: found.name, amount: parseInt(amount), date: new Date().toISOString().split('T')[0], status: "Aktif", getiri: found.getiri });
        render();
        alert(`✅ ${found.name} ürününe ${amount} ₺ yatırım yapıldı!`);
    }
    
    function deleteUserInvestment(id) {
        if (confirm("Bu yatırımı iptal etmek istediğinize emin misiniz?")) {
            userInvestments = userInvestments.filter(inv => inv.id !== id);
            render();
            alert("✅ Yatırım iptal edildi.");
        }
    }
    
    // ---------- MODAL & WHATSAPP ----------
    function whatsappBasvuru(text) {
        window.open(`https://wa.me/905418660202?text=${encodeURIComponent(text)}`, '_blank');
    }
    
    function openLoginModal() {
        const modal = document.createElement("div");
        modal.className = "modal";
        modal.innerHTML = `
            <div class="modal-content">
                <h2 class="text-2xl font-bold text-gold mb-4">🔐 Giriş Yap / Ortak Ol</h2>
                <input type="email" id="loginEmail" placeholder="E-posta" class="w-full p-3 rounded-xl bg-[#1a1f4a] border border-[#2a2f5a] mb-3">
                <input type="password" id="loginPassword" placeholder="Şifre" class="w-full p-3 rounded-xl bg-[#1a1f4a] border border-[#2a2f5a] mb-4">
                <button id="doLogin" class="w-full btn-gold py-2 rounded-xl">Giriş Yap</button>
                <p class="text-center text-gray-400 text-sm mt-4">Demo: ortak@firefinans.com / 123456</p>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById("doLogin").onclick = () => {
            isLoggedIn = true;
            modal.remove();
            render();
        };
    }
    
    // ---------- SAYFALAR ----------
    const pages = {
        home: () => `
            <div class="mb-6"><h2 class="text-3xl font-bold text-gold mb-2">Faizsiz Finans Ekosistemi</h2><p class="text-gray-300">Helal kazanç, ortak yatırım, barter, FIRE fonu ve katılım modelleri</p></div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="card p-6"><i class="fas fa-chart-line text-gold text-3xl mb-2"></i><h3 class="text-xl font-bold text-gold">Yatırım Ürünleri</h3><p class="text-gray-400">Kira sertifikası, sukuk, katılım hisse</p><button class="mt-3 text-gold font-semibold" onclick="currentPage='yatirim';render()">→ Detay</button></div>
                <div class="card p-6"><i class="fas fa-hand-holding-heart text-gold text-3xl mb-2"></i><h3 class="text-xl font-bold text-gold">Faizsiz Sistem</h3><p class="text-gray-400">Eminevim/Katılımevim modeli</p><button class="mt-3 text-gold font-semibold" onclick="currentPage='faizsiz';render()">→ Detay</button></div>
                <div class="card p-6"><i class="fas fa-exchange-alt text-gold text-3xl mb-2"></i><h3 class="text-xl font-bold text-gold">Barter Modülü</h3><p class="text-gray-400">İşletmeler arası takas</p><button class="mt-3 text-gold font-semibold" onclick="currentPage='barter';render()">→ Detay</button></div>
                <div class="card p-6"><i class="fas fa-handshake text-gold text-3xl mb-2"></i><h3 class="text-xl font-bold text-gold">Ortak Yatırım</h3><p class="text-gray-400">Kâr-zarar ortaklığı</p><button class="mt-3 text-gold font-semibold" onclick="currentPage='ortakyatirim';render()">→ Detay</button></div>
                <div class="card p-6"><i class="fas fa-fire text-gold text-3xl mb-2"></i><h3 class="text-xl font-bold text-gold">FİRE Yatırım Fonu</h3><p class="text-gray-400">Faizsiz birikim fonu</p><button class="mt-3 text-gold font-semibold" onclick="currentPage='firefonu';render()">→ Detay</button></div>
                <div class="card p-6"><i class="fas fa-users text-gold text-3xl mb-2"></i><h3 class="text-xl font-bold text-gold">Ortaklık Paketleri</h3><p class="text-gray-400">WhatsApp satış ortaklığı</p><button class="mt-3 text-gold font-semibold" onclick="currentPage='ortaklikpaketleri';render()">→ Detay</button></div>
            </div>
        `,
        yatirim: () => `<div class="card p-6"><h2 class="text-2xl font-bold text-gold mb-4">📊 Yatırım Ürünleri (Faizsiz)</h2><div class="space-y-3">${yatirimUrunleri.map(u => `<div class="flex justify-between items-center p-3 bg-[#1a1f4a] rounded-xl product-item"><div><h3 class="font-bold text-gold">${u.name}</h3><p class="text-sm text-gray-400">Getiri: ${u.getiri} | Risk: ${u.risk} | Min: ${u.minTutar}</p></div><div class="flex gap-2"><button class="text-gold text-sm font-semibold" onclick="whatsappBasvuru('Yatırım başvurusu: ${u.name}')">WhatsApp ile Başvur</button>${isAdmin ? `<button onclick="deleteYatirimUrunu(${u.id})" class="text-red-400 text-sm">🗑️ Sil</button>` : ''}</div></div>`).join('')}</div>${isAdmin ? `<button onclick="addYatirimUrunu()" class="mt-4 w-full btn-gold py-2 rounded-lg">+ Yeni Yatırım Ürünü Ekle</button>` : ''}</div>`,
        faizsiz: () => `<div class="card p-6"><h2 class="text-2xl font-bold text-gold mb-4">🏠 Faizsiz Sistem Ürünleri</h2><div class="grid gap-3">${faizsizUrunler.map(u => `<div class="flex justify-between items-center p-3 bg-[#1a1f4a] rounded-xl faizsiz-item"><div><h3 class="font-bold text-gold">${u.name}</h3><p class="text-sm text-gray-400">${u.aciklama}</p><p class="text-xs text-gold">${u.fiyat}</p></div><button class="text-gold text-sm font-semibold" onclick="whatsappBasvuru('Faizsiz ürün başvurusu: ${u.name}')">Başvur</button></div>`).join('')}</div></div>`,
        barter: () => `<div class="card p-6"><h2 class="text-2xl font-bold text-gold mb-4">🔄 Barter (Takas) Modülü</h2><p class="text-gray-300 mb-4">İşletmeler arası mal/hizmet takası. Faizsiz, komisyonsuz.</p><div class="grid md:grid-cols-2 gap-4"><button class="btn-gold py-2 rounded-lg" onclick="whatsappBasvuru('Barter takas ilanı vermek istiyorum')">Takas İlanı Ver</button><button class="btn-gold py-2 rounded-lg" onclick="whatsappBasvuru('Barter takas aramak istiyorum')">Takas Ara</button></div></div>`,
        ortakyatirim: () => `<div class="card p-6"><h2 class="text-2xl font-bold text-gold mb-4">🤝 Ortak Yatırım Havuzları</h2><div class="space-y-3">${ortakYatirimHavuzlari.map(h => `<div class="flex justify-between items-center p-3 bg-[#1a1f4a] rounded-xl investment-item"><div><h3 class="font-bold text-gold">${h.name}</h3><p class="text-sm text-gray-400">Hedef: ${h.hedef} | Toplanan: ${h.toplanan}</p><p class="text-xs text-gold">Min Katılım: ${h.katilim}</p></div><button class="text-gold text-sm font-semibold" onclick="whatsappBasvuru('Ortak yatırım başvurusu: ${h.name}')">Katıl</button></div>`).join('')}</div></div>`,
        firefonu: () => `<div class="card p-6"><h2 class="text-2xl font-bold text-gold mb-4">🔥 FİRE Yatırım Fonu</h2><p class="text-gray-300">Finansal bağımsızlık için faizsiz birikim fonu.</p><div class="bg-[#1a1f4a] p-4 rounded-xl mt-4"><p class="text-gold font-semibold">Hedef Büyüklük: 50.000.000 ₺</p><p class="text-gold">Güncel Katılım: 12.450.000 ₺</p><div class="h-2 bg-gray-700 rounded-full mt-2"><div class="w-1/4 bg-gold h-2 rounded-full"></div></div><button class="mt-4 btn-gold w-full py-2 rounded-lg" onclick="whatsappBasvuru('FİRE Yatırım Fonu başvurusu')">Fon Katıl (WhatsApp)</button></div></div>`,
        ortaklikpaketleri: () => `<div class="card p-6"><h2 class="text-2xl font-bold text-gold mb-4">🤝 Ortaklık Paketleri (WhatsApp)</h2><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${ortaklikPaketleri.map(p => `<div class="p-4 bg-[#1a1f4a] rounded-xl text-center"><i class="fas ${p.icon} text-gold text-3xl mb-2"></i><h3 class="font-bold text-gold text-lg">${p.name}</h3><p class="text-gold font-semibold">Komisyon: ${p.komisyon}</p><p class="text-sm">${p.fiyat}</p><button class="mt-3 btn-gold px-3 py-1 rounded-lg text-sm w-full" onclick="whatsappBasvuru('Ortaklık başvurusu: ${p.name} paketini satın almak istiyorum.')">WhatsApp ile Katıl</button></div>`).join('')}</div></div>`,
        yatirimlarim: () => `<div class="card p-6"><h2 class="text-2xl font-bold text-gold mb-4">📈 Yatırımlarım (İzleme ve Yönetme)</h2><div class="space-y-3">${userInvestments.length === 0 ? '<p class="text-gray-400">Henüz yatırımınız bulunmuyor.</p>' : userInvestments.map(inv => `<div class="flex justify-between items-center p-3 bg-[#1a1f4a] rounded-xl"><div><h3 class="font-bold text-gold">${inv.name}</h3><p class="text-sm text-gray-400">Tutar: ${inv.amount} ₺ | Tarih: ${inv.date} | Getiri: ${inv.getiri}</p><span class="text-xs text-emerald-400">${inv.status}</span></div><button onclick="deleteUserInvestment(${inv.id})" class="text-red-400 text-sm"><i class="fas fa-trash mr-1"></i>İptal</button></div>`).join('')}</div><button onclick="addUserInvestment()" class="mt-5 w-full btn-gold py-2 rounded-lg">+ Yeni Yatırım Ekle</button></div>`
    };
    
    // ---------- SIDEBAR ----------
    function renderSidebar() {
        const menu = [
            { id: "home", label: "🏠 Anasayfa", icon: "fa-home" },
            { id: "yatirim", label: "📈 Yatırım Ürünleri", icon: "fa-chart-line" },
            { id: "faizsiz", label: "🏦 Faizsiz Sistem", icon: "fa-hand-holding-heart" },
            { id: "barter", label: "🔄 Barter Modülü", icon: "fa-exchange-alt" },
            { id: "ortakyatirim", label: "🤝 Ortak Yatırım", icon: "fa-handshake" },
            { id: "firefonu", label: "🔥 FİRE Yatırım Fonu", icon: "fa-fire" },
            { id: "ortaklikpaketleri", label: "📦 Ortaklık Paketleri", icon: "fa-box" },
            { id: "yatirimlarim", label: "📊 Yatırımlarım", icon: "fa-chart-simple" }
        ];
        return `
            <aside class="fixed left-0 top-0 h-full w-72 bg-[#0a0f2c] shadow-2xl border-r border-[#1e2a5e] p-5 overflow-y-auto z-10">
                <div class="flex items-center justify-between mb-8"><div class="flex items-center gap-3"><i class="fas fa-chart-line text-gold text-2xl"></i><h1 class="text-2xl font-bold text-gold">Faizsiz Finans</h1></div><div class="admin-badge" onclick="openAdminPanel()"><i class="fas fa-shield-alt mr-1"></i>Yönetim</div></div>
                <nav class="space-y-1">
                    ${menu.map(item => `<div onclick="currentPage='${item.id}'; render()" class="sidebar-link ${currentPage === item.id ? 'active-page' : 'text-gray-300'}"><i class="fas ${item.icon} w-5"></i><span>${item.label}</span></div>`).join('')}
                </nav>
                <div class="absolute bottom-0 left-0 right-0 p-5 border-t border-[#1e2a5e]">
                    ${!isLoggedIn ? `<button onclick="openLoginModal()" class="w-full btn-gold py-2 rounded-lg">Giriş Yap / Ortak Ol</button>` : `<div class="text-center"><p class="text-gold font-bold">${user.name}</p><p class="text-sm text-gray-400">${user.ortaklik}</p><button onclick="isLoggedIn=false;render()" class="mt-2 text-red-400 text-sm">Çıkış</button></div>`}
                </div>
            </aside>
        `;
    }
    
    // ---------- FOOTER ----------
    function renderFooter() {
        return `
            <footer class="ml-72 border-t border-[#1e2a5e] mt-12 pt-8 pb-6 text-center text-gray-400 text-sm">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6 text-left px-6">
                    <div><h3 class="text-gold font-bold">Faizsiz Finans</h3><p>Ortak yatırım, barter, katılım finans ve FIRE fonu</p></div>
                    <div><h3 class="text-gold font-bold">İletişim</h3><p><i class="fab fa-whatsapp text-gold mr-1"></i> 0540 966 6602<br><i class="fas fa-phone text-gold mr-1"></i> 0541 866 0202<br><i class="fas fa-envelope text-gold mr-1"></i> orhanboyraz0216@gmail.com</p></div>
                    <div><h3 class="text-gold font-bold">Adres</h3><p>Agora Çarşısı No: Z/31<br>Nilüfer / BURSA</p></div>
                    <div><h3 class="text-gold font-bold">Web & Yasal</h3><p><a href="https://anadolunetwork.tr" target="_blank" class="hover:text-gold">anadolunetwork.tr</a><br>Kurucu:CFO.Orhan BOYRAZ</p></div>
                </div>
                <div class="border-t border-[#1e2a5e] pt-4">© 2025 Faizsiz Finans | Helal, Katılım, Ortaklık Esaslı</div>
            </footer>
        `;
    }
    
    function render() {
        const content = pages[currentPage] ? pages[currentPage]() : pages.home();
        const html = `<div class="flex min-h-screen">${renderSidebar()}<main class="flex-1 ml-72 p-6"><div class="max-w-6xl mx-auto">${content}${renderFooter()}</div></main></div>`;
        document.getElementById("app").innerHTML = html;
    }
    
    render();
    window.whatsappBasvuru = whatsappBasvuru;
    window.openLoginModal = openLoginModal;
    window.openAdminPanel = openAdminPanel;
    window.addYatirimUrunu = addYatirimUrunu;
    window.deleteYatirimUrunu = deleteYatirimUrunu;
    window.addUserInvestment = addUserInvestment;
    window.deleteUserInvestment = deleteUserInvestment;
</script>
</body>
</html>
